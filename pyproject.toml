[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmstudio-webui"
version = "0.1.0"
description = "Control-plane WebUI and stateless host proxy for LM Studio's /api/v1 model management REST API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
lms-webui = "lmstudio_webui.cli:app"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/lmstudio_webui",
]

[tool.hatch.build.targets.wheel.force-include]
"web" = "lmstudio_webui/web"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "playwright>=1.48.0",
    "pytest-playwright>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
